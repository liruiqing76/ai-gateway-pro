<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
:root {
  /* Brand primary */
  --gw-primary: #1677FF;
  --gw-primary-foreground: #FFFFFF;
  --gw-primary-50: #E8F4FF;
  --gw-primary-100: #D1E9FF;

  /* Neutral surfaces */
  --gw-background: #F5F5F7;
  --gw-foreground: #1D1D1F;

  --gw-card: #FFFFFF;
  --gw-card-foreground: #1D1D1F;

  --gw-popover: #FFFFFF;
  --gw-popover-foreground: #1D1D1F;

  --gw-muted: #F2F2F5;
  --gw-muted-foreground: #6E6E73;

  --gw-border: #E5E5EA;
  --gw-input: #E5E5EA;
  --gw-ring: #1677FF;

  /* Typography */
  --gw-font-sans: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --gw-font-mono: "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;

  /* Radius scale */
  --gw-radius-xs: 2px;
  --gw-radius-sm: 4px;
  --gw-radius-md: 8px;
  --gw-radius-lg: 12px;
  --gw-radius-pill: 999px;

  /* Shadows */
  --gw-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.02);
  --gw-shadow-modal: 0 8px 24px -8px rgba(15, 23, 42, 0.12);
  --gw-shadow-popover: 0 24px 60px -20px rgba(15, 23, 42, 0.20);

  /* State colors (semantic only) */
  --gw-state-success: #22C55E;
  --gw-state-success-bg: #DCFCE7;
  --gw-state-success-fg: #166534;

  --gw-state-warning: #F59E0B;
  --gw-state-warning-bg: #FEF3C7;
  --gw-state-warning-fg: #92400E;

  --gw-state-error: #EF4444;
  --gw-state-error-bg: #FEE2E2;
  --gw-state-error-fg: #991B1B;

  --gw-state-info: #3B82F6;
  --gw-state-info-bg: #DBEAFE;
  --gw-state-info-fg: #1E40AF;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gw-background);
    --color-foreground: var(--gw-foreground);
    --color-card: var(--gw-card);
    --color-card-foreground: var(--gw-card-foreground);
    --color-popover: var(--gw-popover);
    --color-popover-foreground: var(--gw-popover-foreground);
    --color-primary: var(--gw-primary);
    --color-primary-foreground: var(--gw-primary-foreground);
    --color-muted: var(--gw-muted);
    --color-muted-foreground: var(--gw-muted-foreground);
    --color-border: var(--gw-border);
    --color-input: var(--gw-input);
    --color-ring: var(--gw-ring);
    --radius-sm: var(--gw-radius-sm);
    --radius-md: var(--gw-radius-md);
    --radius-lg: var(--gw-radius-lg);
  }
  @layer base {
    body { background: var(--gw-background); color: var(--gw-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--gw-background); }
      .text-background { color: var(--gw-background); }
      .border-background { border-color: var(--gw-background); }
      .ring-background { --tw-ring-color: var(--gw-background); }
      .bg-foreground { background-color: var(--gw-foreground); }
      .text-foreground { color: var(--gw-foreground); }
      .border-foreground { border-color: var(--gw-foreground); }
      .ring-foreground { --tw-ring-color: var(--gw-foreground); }
      .bg-card { background-color: var(--gw-card); }
      .text-card { color: var(--gw-card); }
      .border-card { border-color: var(--gw-card); }
      .ring-card { --tw-ring-color: var(--gw-card); }
      .bg-card-foreground { background-color: var(--gw-card-foreground); }
      .text-card-foreground { color: var(--gw-card-foreground); }
      .border-card-foreground { border-color: var(--gw-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--gw-card-foreground); }
      .bg-popover { background-color: var(--gw-popover); }
      .text-popover { color: var(--gw-popover); }
      .border-popover { border-color: var(--gw-popover); }
      .ring-popover { --tw-ring-color: var(--gw-popover); }
      .bg-popover-foreground { background-color: var(--gw-popover-foreground); }
      .text-popover-foreground { color: var(--gw-popover-foreground); }
      .border-popover-foreground { border-color: var(--gw-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--gw-popover-foreground); }
      .bg-primary { background-color: var(--gw-primary); }
      .text-primary { color: var(--gw-primary); }
      .border-primary { border-color: var(--gw-primary); }
      .ring-primary { --tw-ring-color: var(--gw-primary); }
      .bg-primary-foreground { background-color: var(--gw-primary-foreground); }
      .text-primary-foreground { color: var(--gw-primary-foreground); }
      .border-primary-foreground { border-color: var(--gw-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--gw-primary-foreground); }
      .bg-muted { background-color: var(--gw-muted); }
      .text-muted { color: var(--gw-muted); }
      .border-muted { border-color: var(--gw-muted); }
      .ring-muted { --tw-ring-color: var(--gw-muted); }
      .bg-muted-foreground { background-color: var(--gw-muted-foreground); }
      .text-muted-foreground { color: var(--gw-muted-foreground); }
      .border-muted-foreground { border-color: var(--gw-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--gw-muted-foreground); }
      .bg-border { background-color: var(--gw-border); }
      .text-border { color: var(--gw-border); }
      .border-border { border-color: var(--gw-border); }
      .ring-border { --tw-ring-color: var(--gw-border); }
      .bg-input { background-color: var(--gw-input); }
      .text-input { color: var(--gw-input); }
      .border-input { border-color: var(--gw-input); }
      .ring-input { --tw-ring-color: var(--gw-input); }
      .bg-ring { background-color: var(--gw-ring); }
      .text-ring { color: var(--gw-ring); }
      .border-ring { border-color: var(--gw-ring); }
      .ring-ring { --tw-ring-color: var(--gw-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative h-screen overflow-hidden" data-viewport-mode="app-shell">
        <!-- 左侧边栏 -->
        <aside id="sidebar-nav" class="fixed left-0 top-0 bottom-0 z-50 flex w-[240px] flex-col border-r border-border bg-card" style="width:240px;">
            <div class="flex h-16 items-center gap-3 border-b border-border px-6">
                <i data-lucide="zap" class="h-6 w-6 text-primary"></i>
                <span class="text-lg font-semibold text-card-foreground">智能网关</span>
            </div>
            <nav class="flex flex-1 flex-col gap-1 overflow-y-auto p-4">
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="layout-dashboard" class="h-4 w-4"></i>仪表盘</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-semibold text-primary transition" style="background-color:var(--gw-primary-50);"><i data-lucide="layers" class="h-4 w-4"></i>渠道管理</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="brain-circuit" class="h-4 w-4"></i>模型列表</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="key-round" class="h-4 w-4"></i>API 密钥</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="credit-card" class="h-4 w-4"></i>计费中心</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="clock" class="h-4 w-4"></i>自动签到</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="route" class="h-4 w-4"></i>路由组</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="tag" class="h-4 w-4"></i>模型别名</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="activity" class="h-4 w-4"></i>请求链路</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="message-square" class="h-4 w-4"></i>聊天记录</a>
                <a href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted hover:text-foreground"><i data-lucide="book-open" class="h-4 w-4"></i>经验积累</a>
            </nav>
        </aside>

        <!-- 右侧内容区 -->
        <div class="flex h-screen flex-col overflow-y-auto bg-background" style="margin-left:240px;" data-scroll-region="primary">
            <header class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-border bg-card px-8">
                <div class="flex items-center gap-4">
                    <button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-md text-muted-foreground transition hover:bg-muted hover:text-foreground">
                        <i data-lucide="menu" class="h-5 w-5"></i>
                    </button>
                    <h2 class="text-lg font-semibold text-card-foreground">渠道管理</h2>
                </div>
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-2 text-sm text-muted-foreground">
                        <i data-lucide="mail" class="h-4 w-4"></i>
                        <span>603888266@qq.com</span>
                    </div>
                    <button type="button" class="text-sm font-medium text-primary transition hover:text-primary/80">退出</button>
                </div>
            </header>

            <div class="flex-1 p-8">
                <div class="mx-auto max-w-5xl">
                    <!-- 操作栏 -->
                    <div class="mb-6 flex items-center justify-between">
                        <h1 class="text-2xl font-semibold text-foreground">渠道管理</h1>
                        <div class="flex items-center gap-3">
                            <button type="button" class="inline-flex items-center gap-2 rounded-md border border-border bg-card px-4 py-2 text-sm font-medium text-card-foreground transition hover:bg-muted">
                                <i data-lucide="zap" class="h-4 w-4"></i>一键添加
                            </button>
                            <button type="button" class="inline-flex items-center gap-2 rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:bg-primary/90">
                                <i data-lucide="plus" class="h-4 w-4"></i>添加渠道
                            </button>
                        </div>
                    </div>

                    <!-- 渠道表格 -->
                    <section id="provider-table" class="rounded-md border border-border bg-card">
                        <table class="w-full text-sm [&_tr:last-child_td]:border-0">
                            <thead>
                                <tr>
                                    <th class="border-b border-border px-6 py-3 text-left text-xs font-medium text-muted-foreground">名称</th>
                                    <th class="border-b border-border px-6 py-3 text-left text-xs font-medium text-muted-foreground">Base URL</th>
                                    <th class="border-b border-border px-6 py-3 text-center text-xs font-medium text-muted-foreground">模型数</th>
                                    <th class="border-b border-border px-6 py-3 text-center text-xs font-medium text-muted-foreground">状态</th>
                                    <th class="border-b border-border px-6 py-3 text-center text-xs font-medium text-muted-foreground">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="border-b border-border px-6 py-3 font-medium text-card-foreground">NVIDIA</td>
                                    <td class="border-b border-border px-6 py-3"><code class="rounded bg-muted px-1.5 py-0.5 font-mono text-xs text-card-foreground">https://integrate.api.nvidia.com/v1</code></td>
                                    <td class="border-b border-border px-6 py-3 text-center text-card-foreground">12</td>
                                    <td class="border-b border-border px-6 py-3 text-center"><span class="inline-flex items-center rounded px-2 py-0.5 text-xs font-medium" style="background-color:var(--gw-state-success-bg);color:var(--gw-state-success-fg);">启用</span></td>
                                    <td class="border-b border-border px-6 py-3"><div class="flex items-center justify-center gap-3"><a href="#" class="text-sm font-medium text-primary">编辑</a><a href="#" class="text-sm font-medium" style="color:var(--gw-state-error);">删除</a></div></td>
                                </tr>
                                <tr>
                                    <td class="border-b border-border px-6 py-3 font-medium text-card-foreground">魔搭</td>
                                    <td class="border-b border-border px-6 py-3"><code class="rounded bg-muted px-1.5 py-0.5 font-mono text-xs text-card-foreground">https://api-inference.modelscope.cn/v1</code></td>
                                    <td class="border-b border-border px-6 py-3 text-center text-card-foreground">8</td>
                                    <td class="border-b border-border px-6 py-3 text-center"><span class="inline-flex items-center rounded px-2 py-0.5 text-xs font-medium" style="background-color:var(--gw-state-success-bg);color:var(--gw-state-success-fg);">启用</span></td>
                                    <td class="border-b border-border px-6 py-3"><div class="flex items-center justify-center gap-3"><a href="#" class="text-sm font-medium text-primary">编辑</a><a href="#" class="text-sm font-medium" style="color:var(--gw-state-error);">删除</a></div></td>
                                </tr>
                                <tr>
                                    <td class="border-b border-border px-6 py-3 font-medium text-card-foreground">SenseNova</td>
                                    <td class="border-b border-border px-6 py-3"><code class="rounded bg-muted px-1.5 py-0.5 font-mono text-xs text-card-foreground">https://api.sensenova.cn/v1</code></td>
                                    <td class="border-b border-border px-6 py-3 text-center text-card-foreground">5</td>
                                    <td class="border-b border-border px-6 py-3 text-center"><span class="inline-flex items-center rounded px-2 py-0.5 text-xs font-medium" style="background-color:var(--gw-state-info-bg);color:var(--gw-state-info-fg);">停用</span></td>
                                    <td class="border-b border-border px-6 py-3"><div class="flex items-center justify-center gap-3"><a href="#" class="text-sm font-medium text-primary">编辑</a><a href="#" class="text-sm font-medium" style="color:var(--gw-state-error);">删除</a></div></td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="px-6 py-4 text-xs text-muted-foreground">共 3 个渠道 · 25 个模型 · 点击右上角添加新渠道</div>
                    </section>
                </div>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
