<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录页重设计预览 · AI 网关</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }

  .login-split { display: flex; min-height: 100vh; width: 100%; }

  /* 左侧品牌区 */
  .brand-panel {
    position: relative; flex: 0 0 46%; max-width: 560px; overflow: hidden;
    background: linear-gradient(150deg, #0A1A3F 0%, #122C6E 48%, #1A6CFF 100%);
    color: #fff; display: flex; flex-direction: column; justify-content: space-between;
    padding: 56px 52px;
  }
  .brand-decor { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.5; pointer-events: none; }
  .brand-decor--1 { width: 360px; height: 360px; top: -120px; right: -100px;
    background: radial-gradient(circle, rgba(255,138,61,0.55), transparent 70%); }
  .brand-decor--2 { width: 440px; height: 440px; bottom: -170px; left: -130px;
    background: radial-gradient(circle, rgba(64,158,255,0.55), transparent 70%); }
  .brand-decor--grid { inset: 0; border-radius: 0; filter: none; opacity: 0.06;
    background-image: linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px);
    background-size: 32px 32px; }
  .brand-content { position: relative; z-index: 1; }
  .brand-mark { width: 84px; height: 84px; border-radius: 22px; background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); margin-bottom: 28px; }
  .brand-mark img { width: 54px; height: 54px; object-fit: contain; }
  .brand-title { font-size: 34px; font-weight: 700; letter-spacing: 0.5px; margin: 0 0 10px; }
  .brand-tagline { font-size: 15px; color: rgba(255,255,255,0.78); margin: 0 0 36px; }
  .brand-features { list-style: none; display: flex; flex-direction: column; gap: 16px; }
  .brand-features li { display: flex; align-items: center; gap: 12px; font-size: 15px; color: rgba(255,255,255,0.92); }
  .feat-icon { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,138,61,0.18); border: 1px solid rgba(255,138,61,0.5); color: #FFB277;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .brand-footer { position: relative; z-index: 1; font-size: 12px; color: rgba(255,255,255,0.5); }

  /* 右侧表单区 */
  .form-panel { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 40px;
    background: radial-gradient(1200px 600px at 70% -10%, #EAF2FF 0%, #F5F5F7 55%); }
  .login-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid #E5E5EA;
    border-radius: 18px; padding: 40px 36px; box-shadow: 0 24px 60px -20px rgba(15,23,42,0.2); }
  .form-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .form-brand-mark { width: 40px; height: 40px; border-radius: 11px; background: #E8F4FF;
    display: inline-flex; align-items: center; justify-content: center; }
  .form-brand-mark img { width: 26px; height: 26px; object-fit: contain; }
  .form-brand-name { font-size: 18px; font-weight: 700; color: #1D1D1F; }
  .form-title { font-size: 24px; font-weight: 700; color: #1D1D1F; margin: 0 0 6px; }
  .form-subtitle { font-size: 13px; color: #6E6E73; margin: 0 0 26px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: #1D1D1F; margin-bottom: 6px; font-weight: 500; }
  .field input { width: 100%; height: 40px; border: 1px solid #E5E5EA; border-radius: 10px;
    padding: 0 12px; font-size: 14px; outline: none; background: #fff; color: #1D1D1F; }
  .field input:focus { border-color: #1677FF; box-shadow: 0 0 0 3px rgba(22,119,255,0.12); }
  .submit-btn { width: 100%; height: 46px; margin-top: 6px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; letter-spacing: 2px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #4096FF 0%, #1677FF 100%);
    box-shadow: 0 8px 20px -6px rgba(22,119,255,0.55); }
  .mode-switch { text-align: center; margin-top: 18px; font-size: 13px; color: #6E6E73; }
  .mode-switch a { color: #1677FF; cursor: pointer; margin-left: 4px; text-decoration: none; }
  .lang-row { text-align: center; margin-top: 22px; }
  .lang-row .seg { display: inline-flex; border: 1px solid #E5E5EA; border-radius: 8px; overflow: hidden; }
  .lang-row .seg span { padding: 4px 14px; font-size: 13px; color: #6E6E73; cursor: pointer; }
  .lang-row .seg span.active { background: #E8F4FF; color: #1677FF; font-weight: 600; }

  @media (max-width: 860px) { .brand-panel { display: none; }
    .form-panel { background: linear-gradient(160deg, #EAF2FF 0%, #F5F5F7 60%); } }
  .note { position: fixed; bottom: 8px; right: 12px; font-size: 11px; color: #aeaeb2; }
</style>
</head>
<body>
  <div class="login-split">
    <aside class="brand-panel">
      <div class="brand-decor brand-decor--1"></div>
      <div class="brand-decor brand-decor--2"></div>
      <div class="brand-decor brand-decor--grid"></div>
      <div class="brand-content">
        <div class="brand-mark"><img src="../web/frenchie-logo.png" alt="AI 网关" /></div>
        <h1 class="brand-title">AI 网关</h1>
        <p class="brand-tagline">企业级 AI 模型统一接入网关</p>
        <ul class="brand-features">
          <li><span class="feat-icon">✓</span><span>统一接入 200+ 主流大模型</span></li>
          <li><span class="feat-icon">✓</span><span>按量计费 · 成本实时可见</span></li>
          <li><span class="feat-icon">✓</span><span>API 密钥一键轮换 · 安全可控</span></li>
        </ul>
      </div>
      <div class="brand-footer">© 2026 AI 网关 · Smart Gateway</div>
    </aside>

    <main class="form-panel">
      <div class="login-card">
        <div class="form-brand">
          <span class="form-brand-mark"><img src="../web/frenchie-logo.png" alt="AI 网关" /></span>
          <span class="form-brand-name">AI 网关</span>
        </div>
        <h2 class="form-title">欢迎回来</h2>
        <p class="form-subtitle">聚合免费额度 · 一个 API 调所有模型</p>

        <div class="field"><label>邮箱</label><input placeholder="you@example.com" /></div>
        <div class="field"><label>密码</label><input type="password" placeholder="至少 8 位，含大小写+数字+符号" /></div>
        <button class="submit-btn">登 录</button>

        <div class="mode-switch">还没有账号?<a>去注册</a></div>
        <div class="lang-row"><div class="seg"><span class="active">中文</span><span>EN</span></div></div>
      </div>
    </main>
  </div>
  <div class="note">预览稿 · 实际效果以 web-vue/src/views/Login.vue 为准</div>
</body>
</html>
