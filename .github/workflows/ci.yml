name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行测试
        run: pytest tests/ -q
        env:
          GW_DEBUG: "false"

  frontend-build:
    name: 前端构建 (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        working-directory: web-vue
        run: npm install
      - name: 构建前端
        working-directory: web-vue
        run: npm run build